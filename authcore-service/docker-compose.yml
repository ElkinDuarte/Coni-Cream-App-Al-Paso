version: "3.8"

services:
  authcore-db:
    image: postgres:17-alpine
    container_name: authcore-db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      # Solo montamos los scripts SQL en modo lectura (NO hay volumen persistente de datos)
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  authcore-service:
    build: .
    container_name: authcore-service
    depends_on:
      authcore-db:
        condition: service_healthy # Espera a que PostgreSQL ejecute el seed antes de arrancar Spring Boot
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://authcore-db:5432/auth_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: lD6FtWWWLBqHzm7osQiel+C6RJqgGeqBzVpQ7bmGoyM=
    ports:
      - "8081:8081"
